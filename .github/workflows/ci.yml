name: Crypto Data Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test-producer:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r tests/requirements.txt
    
    - name: Build Docker services
      run: |
        docker compose build
    
    - name: Start services
      run: |
        docker compose up -d
    
    - name: Wait for services
      run: |
        sleep 20
    
    - name: Create Kafka topics
      run: |
        python tests/test_create_topics.py
    
    - name: Run unit tests
      run: |
        python -m pytest tests/producer_test.py -v
    
    - name: Run integration tests
      run: |
        python -m pytest tests/producer_test_integration.py -v
    
    - name: Simulate producer messages
      run: |
        python tests/simulate_producer.py
    
    - name: Test consumer parser
      run: |
        python tests/test_consumer_parser.py
    
    - name: Validate Kafka messages
      run: |
        python tests/validate_kafka_messages.py
    
    - name: Show logs on failure
      if: failure()
      run: |
        docker compose logs --tail=100
    
    - name: Cleanup
      if: always()
      run: |
        docker compose down -v