name: Crypto Data Pipeline CI

on:
push:
branches: [ "main" ]
pull_request:

jobs:
test-build:
runs-on: ubuntu-latest

```
steps:
- name: Checkout repo
  uses: actions/checkout@v4

- name: Set up Python
  uses: actions/setup-python@v4
  with:
    python-version: 3.10

- name: Install dependencies
  run: |
    pip install kafka-python psycopg2 pytest

- name: Run basic tests
  run: |
    python -c "print('CI running...')"

- name: Build Docker services
  run: |
    docker compose build

- name: Start services (Kafka, etc.)
  run: |
    docker compose up -d

- name: Wait for Kafka
  run: |
    sleep 15

- name: Check Kafka topics
  run: |
    docker exec kafka kafka-topics --list --bootstrap-server kafka:9092
```
